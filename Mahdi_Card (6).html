<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0B1F3A;
    color: #F8F5F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Arial, sans-serif;

    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { width: 100%; max-width: 420px; }
  h1 {
    text-align: center;
    color: #C9A84C;
    font-size: 1.3rem;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 0.88rem;
    opacity: 0.8;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 0 0 12px 0;
    border: 2px solid #C9A84C;
    border-radius: 12px;
    background: transparent;
    color: #F8F5F0;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active {
    background: #C9A84C;
    color: #0B1F3A;
  }
  .card-img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: block;
  }
  .info {
    background: rgba(11, 31, 58, 0.95);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 14px;
    padding: 16px;
  }
  .name { font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
  .title { color: #C9A84C; font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
  .spec { font-size: 0.85rem; color: #E8D5A3; margin-bottom: 10px; }
  .line { height: 1px; background: #C9A84C; opacity: 0.35; margin: 10px 0; }
  .label { color: #C9A84C; font-size: 0.75rem; font-weight: 600; margin-bottom: 7px; }
  .item { font-size: 0.9rem; margin-bottom: 5px; }
  .item a { color: #E8D5A3; text-decoration: none; }
  .actions {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .save-btn {
    background: #C9A84C;
    color: #0B1F3A;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .back-btn {
    background: transparent;
    border: 1px solid rgba(201,168,76,0.5);
    color: #E8D5A3;
    padding: 11px;
    border-radius: 10px;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .rtl { direction: rtl; text-align: right; }
  .hidden { display: none !important; }
